  <!-- Left leg (forward) -->
  <line x1="265" y1="295" x2="195" y2="375" stroke="white" stroke-width="22" stroke-linecap="round"/>
  <line x1="195" y1="375" x2="162" y2="420" stroke="white" stroke-width="22" stroke-linecap="round"/>
  <!-- Right leg (back) -->
  <line x1="265" y1="295" x2="345" y2="358" stroke="white" stroke-width="22" stroke-linecap="round"/>
  <line x1="345" y1="358" x2="395" y2="400" stroke="white" stroke-width="22" stroke-linecap="round"/>
  <!-- Left arm (back) -->
  <line x1="288" y1="200" x2="355" y2="168" stroke="white" stroke-width="18" stroke-linecap="round"/>
  <!-- Right arm (forward) -->
  <line x1="288" y1="200" x2="205" y2="248" stroke="white" stroke-width="18" stroke-linecap="round"/>
</svg>
